name: Deploy HAPPENHAUS to GitHub Pages
 
on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Generate runtime config from GitHub Secrets or Variables
        run: |
          cat > config.js << EOF
          window.__HH_CFG__ = {
            apiKey:            "${{ secrets.FB_API_KEY || vars.FB_API_KEY }}",
            authDomain:        "${{ secrets.FB_AUTH_DOMAIN || vars.FB_AUTH_DOMAIN }}",
            projectId:         "${{ secrets.FB_PROJECT_ID || vars.FB_PROJECT_ID }}",
            storageBucket:     "${{ secrets.FB_STORAGE_BUCKET || vars.FB_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FB_MESSAGING_SENDER_ID || vars.FB_MESSAGING_SENDER_ID }}",
            appId:             "${{ secrets.FB_APP_ID || vars.FB_APP_ID }}"
          };
          window.__HH_ADMINS__ = ["${{ secrets.ADMIN_EMAIL_1 || vars.ADMIN_EMAIL_1 }}", "${{ secrets.ADMIN_EMAIL_2 || vars.ADMIN_EMAIL_2 }}"];
          window.__HH_MEDIA__  = {
            cloud:  "${{ secrets.CLOUDINARY_CLOUD || vars.CLOUDINARY_CLOUD }}",
            preset: "${{ secrets.CLOUDINARY_PRESET || vars.CLOUDINARY_PRESET }}"
          };
          window.__HH_EMAILJS__ = {
            serviceId: "${{ secrets.EMAILJS_SERVICE_ID || vars.EMAILJS_SERVICE_ID }}",
            templateId: "${{ secrets.EMAILJS_TEMPLATE_ID || vars.EMAILJS_TEMPLATE_ID }}",
            publicKey: "${{ secrets.EMAILJS_PUBLIC_KEY || vars.EMAILJS_PUBLIC_KEY }}"
          };
          window.__HH_CONTACT__ = {
            whatsapp: "${{ secrets.CONTACT_WHATSAPP || vars.CONTACT_WHATSAPP }}",
            phone: "${{ secrets.CONTACT_PHONE || vars.CONTACT_PHONE }}"
          };
          EOF

      - name: Validate generated runtime config
        run: |
          test -s config.js
          ! grep -Eq 'apiKey:\s+""' config.js
          ! grep -Eq 'authDomain:\s+""' config.js
          ! grep -Eq 'projectId:\s+""' config.js
          ! grep -Eq 'storageBucket:\s+""' config.js
          ! grep -Eq 'messagingSenderId:\s+""' config.js
          ! grep -Eq 'appId:\s+""' config.js
          ! grep -Eq 'cloud:\s+""' config.js
          ! grep -Eq 'preset:\s+""' config.js

      - name: Print config availability summary
        run: |
          echo "FB_API_KEY configured: ${{ secrets.FB_API_KEY != '' || vars.FB_API_KEY != '' }}"
          echo "FB_AUTH_DOMAIN configured: ${{ secrets.FB_AUTH_DOMAIN != '' || vars.FB_AUTH_DOMAIN != '' }}"
          echo "FB_PROJECT_ID configured: ${{ secrets.FB_PROJECT_ID != '' || vars.FB_PROJECT_ID != '' }}"
          echo "FB_STORAGE_BUCKET configured: ${{ secrets.FB_STORAGE_BUCKET != '' || vars.FB_STORAGE_BUCKET != '' }}"
          echo "FB_MESSAGING_SENDER_ID configured: ${{ secrets.FB_MESSAGING_SENDER_ID != '' || vars.FB_MESSAGING_SENDER_ID != '' }}"
          echo "FB_APP_ID configured: ${{ secrets.FB_APP_ID != '' || vars.FB_APP_ID != '' }}"
          echo "CLOUDINARY_CLOUD configured: ${{ secrets.CLOUDINARY_CLOUD != '' || vars.CLOUDINARY_CLOUD != '' }}"
          echo "CLOUDINARY_PRESET configured: ${{ secrets.CLOUDINARY_PRESET != '' || vars.CLOUDINARY_PRESET != '' }}"
 
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare Pages bundle
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp ab-events-admin.html _site/
          cp 404.html _site/
          cp manifest.json _site/
          cp sw.js _site/
          cp gallery-config.js _site/
          cp CNAME _site/
          cp config.js _site/

      - name: Inspect Pages bundle
        run: |
          ls -la _site
          test -f _site/config.js
          grep -q 'window.__HH_CFG__' _site/config.js
 
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
